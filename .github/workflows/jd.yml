name: jd-laptops

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: jd-laptops
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install --quiet openpyxl

      - name: restore state
        uses: actions/cache@v4
        with:
          path: |
            pipeline/data
            pipeline/cache
          key: jd-state-${{ github.run_id }}
          restore-keys: jd-state-

      - name: collect
        working-directory: pipeline
        env:
          PY: python3
          REPORT_OUT: ../redmibook_pro_auto.xlsx
        run: |
          bash drip.sh || true
          tail -25 logs/auto_$(date +%Y%m%d).log 2>/dev/null || true

      - name: save state
        run: |
          git config user.name  "jd-bot"
          git config user.email "jd-bot@users.noreply.github.com"
          git add -A pipeline/data pipeline/config.json redmibook_pro_auto.xlsx 2>/dev/null || true
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "нет изменений"
          git push origin HEAD || echo "push пропущен"

      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: redmibook-pro-report
          path: redmibook_pro_auto.xlsx
          retention-days: 14
